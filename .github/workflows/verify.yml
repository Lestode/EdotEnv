name: Verify project

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  project-checks:
    name: Project checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.13.5'
      - name: Install validation tools
        run: |
          uv pip install --system pre-commit==4.2.0 -r experiments/verifier-context/requirements.txt
          uv pip install --system --index-url https://download.pytorch.org/whl/cpu 'torch==2.8.0+cpu'
          uv pip install --system -r requirements-distillation-test.txt
      - name: Check tracked project files
        run: pre-commit run --all-files
      - name: Check distillation shell entry points
        run: |
          for script in scripts/distillation*.sh scripts/init-distillation*.sh scripts/distillation*.slurm; do
            bash -n "$script"
          done
      - name: Check project documentation and review configuration
        run: python scripts/check_project.py
      - name: Test reviewer freshness detection and alert lifecycle
        run: node --test tests/*.test.cjs
      - name: Run project Python CPU tests when present
        shell: bash
        run: |
          if [ -d tests ] && [ -n "$(find tests -name 'test_*.py' -type f -print -quit)" ]; then
            python -m unittest discover -s tests -p 'test_*.py' -v
          else
            echo 'No Python CPU tests yet; training correctness and GPU validation remain unverified.'
          fi
