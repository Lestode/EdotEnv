name: Verify project

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  project-checks:
    name: Project checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install validation tools
        run: python -m pip install pre-commit==4.2.0 -r experiments/verifier-context/requirements.txt
      - name: Check tracked project files
        run: pre-commit run --all-files
      - name: Check project documentation and review configuration
        run: python scripts/check_project.py
      - name: Run project CPU tests when present
        shell: bash
        run: |
          if [ -d tests ]; then
            python -m unittest discover -s tests -p 'test_*.py' -v
          else
            echo 'No project CPU tests yet; OPCD implementation and GPU validation remain pending.'
          fi
