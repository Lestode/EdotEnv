name: Reviewer freshness

on:
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: reviewer-freshness
  cancel-in-progress: false

jobs:
  check:
    if: github.repository == 'Lestode/EdotEnv'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Manual dispatch also uses accepted project code and settings.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Fetch reviewer default branch for comparison only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Lestode/review-agents
          ssh-key: ${{ secrets.REVIEW_AGENTS_READ_KEY }}
          path: .review-agent
          fetch-depth: 0
          persist-credentials: false
      - name: Maintain the reviewer update alert
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { comparison, report } = require('./scripts/reviewer_freshness.cjs');
            await report({ github, context, core, revisions: comparison() });
