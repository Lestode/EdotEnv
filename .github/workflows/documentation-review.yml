name: Local documentation review

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: >-
      github.event.repository.private &&
      ((github.event_name == 'pull_request_target' &&
        github.event.pull_request.user.type == 'User') ||
       (github.event.issue.pull_request &&
        github.event.comment.user.type == 'User' &&
        startsWith(github.event.comment.body, '/review-docs')))
    runs-on: [self-hosted, macOS, edotenv]
    timeout-minutes: 15
    steps:
      - name: Resolve the accepted reviewer revision
        id: reviewer
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { data } = await github.rest.repos.getBranch({
              ...context.repo, branch: context.payload.repository.default_branch,
            });
            core.setOutput('sha', data.commit.sha);
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.reviewer.outputs.sha }}
          persist-credentials: false
      - name: Review with the shared local agent
        uses: Lestode/review-agents/documentation-review@6eda8f76f55eebfee5020271e9a8d9d1149d9e2a
        with:
          config-path: .github/documentation-review.json
