name: Review comparison

on:
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Open PR whose real checks should be verified on its test merge
        required: true
        type: string
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, edited]
  issue_comment:
    types: [created]
  workflow_run:
    workflows: [API agent reviews, Verify project]
    types: [in_progress, completed]

permissions:
  actions: read
  contents: read
  pull-requests: read
  checks: write

jobs:
  authorize:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    if: >-
      (github.event_name == 'pull_request_target' &&
       (github.event.action != 'edited' || github.event.changes.base)) ||
      github.event_name == 'workflow_run' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request && github.event.comment.user.type == 'User' &&
       (startsWith(github.event.comment.body, '/review-docs') ||
        startsWith(github.event.comment.body, '/review-implementation')))
    outputs:
      allowed: ${{ steps.permission.outputs.allowed }}
      number: ${{ steps.permission.outputs.number }}
    steps:
      - id: permission
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const run = context.payload.workflow_run;
            let projectRun = false;
            let number = context.payload.pull_request?.number || context.payload.issue?.number ||
              Number(context.payload.inputs?.pull_request_number);
            let actor = context.eventName === 'issue_comment' ? context.payload.comment.user : context.payload.sender;
            if (context.eventName === 'workflow_run') {
              const path = run.path?.split('@')[0];
              if (!['.github/workflows/documentation-review.yml', '.github/workflows/verify.yml'].includes(path)) return;
              projectRun = path === '.github/workflows/verify.yml';
              if (!projectRun && run.status !== 'completed') return;
              number = projectRun
                ? Number(run.pull_requests?.[0]?.number)
                : Number(/^Review PR #([1-9][0-9]*)$/.exec(run.display_title || '')?.[1]);
              actor = run.actor;
            }
            if (!Number.isSafeInteger(number) || number <= 0) return;
            if (projectRun) {
              // A native verification event may originate from a fork or bot.
              // It is not permission to call a model or execute any PR code.
              const { data: pull } = await github.rest.pulls.get({ ...context.repo, pull_number: number });
              if (run.event !== 'pull_request' || pull.state !== 'open' || pull.head.sha !== run.head_sha) return;
              core.setOutput('number', String(number));
              core.setOutput('allowed', 'true');
              return;
            }
            if (actor?.type !== 'User') return;
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
              ...context.repo, username: actor.login,
            });
            core.setOutput('number', String(number));
            core.setOutput('allowed', String(['write', 'maintain', 'admin'].includes(data.permission)));


  comparison:
    needs: authorize
    if: needs.authorize.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Serialize with the reviewer job so its source checks cannot change
    # while this job verifies and publishes test-merge attestations.
    concurrency:
      group: documentation-review-${{ needs.authorize.outputs.number }}
      queue: max
      cancel-in-progress: false
    steps:
      # No checkout, model call, or secrets: only verify GitHub evidence.
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const repo = context.repo;
            const number = context.payload.pull_request?.number || context.payload.issue?.number ||
              Number(context.payload.inputs?.pull_request_number) ||
              Number(context.payload.workflow_run?.pull_requests?.[0]?.number) ||
              Number(/^Review PR #([1-9][0-9]*)$/.exec(context.payload.workflow_run?.display_title || '')?.[1]);
            if (context.eventName === 'issue_comment') {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                ...repo, username: context.payload.comment.user.login,
              });
              if (!['write', 'maintain', 'admin'].includes(data.permission)) return;
            }
            const required = ['Documentation reviewer', 'Implementation reviewer'];
            let comparison;
            let checkId;
            let checkMerge;
            for (let attempt = 0; attempt < 5; attempt++) {
              const { data: pull } = await github.rest.pulls.get({ ...repo, pull_number: number });
              const key = JSON.stringify([pull.head.sha, pull.base.sha, pull.base.ref]);
              if (pull.state !== 'open' || (comparison && comparison !== key)) {
                if (checkId) await github.rest.checks.update({ ...repo, check_run_id: checkId,
                  status: 'completed', conclusion: 'failure', output: {
                    title: 'PR changed or closed', summary: 'Fresh review of the current comparison is required.',
                  } });
                return;
              }
              comparison = key;
              // GitHub may briefly return an old or missing synthetic merge commit.
              // Verify its parents before attaching any check to it.
              if (pull.merge_commit_sha) {
                const { data: merge } = await github.rest.git.getCommit({ ...repo, commit_sha: pull.merge_commit_sha });
                const parents = merge.parents.map(parent => parent.sha);
                if (parents.length === 2 && parents.includes(pull.head.sha) && parents.includes(pull.base.sha)) {
                  if (!checkId || checkMerge !== pull.merge_commit_sha) {
                    const { data } = await github.rest.checks.create({ ...repo,
                      name: 'Current review comparison', head_sha: pull.merge_commit_sha, status: 'in_progress',
                      output: { title: 'Waiting for both reviewers', summary: 'Reviews must match the current head, target commit, and target branch.' },
                    });
                    checkId = data.id;
                    checkMerge = pull.merge_commit_sha;
                  }
                  const comments = await github.paginate(github.rest.issues.listComments, { ...repo, issue_number: number, per_page: 100 });
                  const assessments = comments.flatMap(comment => {
                    if (comment.user?.login !== 'github-actions[bot]') return [];
                    const match = /(?:^|\n)<!-- review-agent-result:([A-Za-z0-9_-]{1,16000}) -->\s*$/.exec(comment.body || '');
                    if (!match) return [];
                    try {
                      const value = JSON.parse(Buffer.from(match[1], 'base64url').toString('utf8'));
                      return value.version === 1 && value.kind === 'review' &&
                        value.head === pull.head.sha && value.base === pull.base.sha && value.baseRef === pull.base.ref ? [value] : [];
                    } catch { return []; }
                  });
                  const reviewerChecks = await github.paginate(github.rest.checks.listForRef, { ...repo, ref: pull.head.sha, per_page: 100, filter: 'all' });
                  const latestHead = name => reviewerChecks.filter(check =>
                    check.name === name && check.app?.slug === 'github-actions' &&
                    check.head_sha === pull.head.sha).sort((a, b) => b.id - a.id)[0];
                  // Test execution keeps a read-only token in its own job. This
                  // serialized writer owns the required Project checks result.
                  const native = latestHead('Run project verification');
                  let sourceStatus = 'in_progress', sourceConclusion;
                  if (native) {
                    const { data: job } = await github.rest.actions.getJobForWorkflowRun({ ...repo, job_id: native.id });
                    const { data: run } = await github.rest.actions.getWorkflowRun({ ...repo, run_id: job.run_id });
                    if (job.id !== native.id || job.name !== 'Run project verification' ||
                        run.path?.split('@')[0] !== '.github/workflows/verify.yml' ||
                        run.event !== 'pull_request' || run.head_sha !== pull.head.sha ||
                        !run.pull_requests?.some(item => item.number === number &&
                          item.head.sha === pull.head.sha && item.base.sha === pull.base.sha &&
                          item.base.ref === pull.base.ref)) {
                      throw new Error('The project result is not from the current verification workflow.');
                    }
                    if (native.status === 'completed' && job.status === 'completed') {
                      sourceStatus = 'completed';
                      sourceConclusion = native.conclusion === 'success' && job.conclusion === 'success'
                        ? 'success' : 'failure';
                    }
                  }
                  let project = reviewerChecks.filter(check => {
                    if (check.name !== 'Project checks' || check.app?.slug !== 'github-actions' ||
                        check.head_sha !== pull.head.sha) return false;
                    try { return JSON.parse(check.output?.text || 'null')?.pullNumber === number; }
                    catch { return false; }
                  }).sort((a, b) => b.id - a.id)[0];
                  let receipt;
                  try { receipt = JSON.parse(project?.output?.text || 'null'); } catch {}
                  const nativeId = native?.id ?? null;
                  if (receipt?.sourceNativeCheckId !== nativeId || receipt?.base !== pull.base.sha ||
                      receipt?.baseRef !== pull.base.ref || project?.status !== sourceStatus ||
                      project?.conclusion !== (sourceConclusion ?? null)) {
                    // Invalidate before changing this required head result. All
                    // required source writers use this same authorized queue.
                    for (const name of ['Project checks', 'Agent reviews completed', ...required]) {
                      await github.rest.checks.create({ ...repo, name, head_sha: checkMerge,
                        status: 'in_progress', output: {
                          title: 'Project verification is being refreshed',
                          summary: 'Current source checks must be verified before these attestations pass.',
                        },
                      });
                    }
                    const { data: updatedProject } = await github.rest.checks.create({ ...repo,
                      name: 'Project checks', head_sha: pull.head.sha, status: sourceStatus,
                      ...(sourceConclusion ? { conclusion: sourceConclusion } : {}),
                      external_id: `project-verification:${number}:${nativeId}`,
                      ...(native?.html_url ? { details_url: native.html_url } : {}),
                      output: {
                        title: native ? 'Verified native project result' : 'Waiting for native project verification',
                        summary: 'This result is derived from Run project verification; no PR code executes in this writer.',
                        text: JSON.stringify({ version: 1, pullNumber: number,
                          sourceNativeCheckId: nativeId, head: pull.head.sha,
                          base: pull.base.sha, baseRef: pull.base.ref }),
                      },
                    });
                    reviewerChecks.push(updatedProject);
                    project = updatedProject;
                  }
                  const reviewSources = new Map([['Project checks', project]]);
                  const complete = required.every(name => {
                    const checks = reviewerChecks.filter(check => {
                      if (check.name !== name || check.app?.slug !== 'github-actions' ||
                          check.head_sha !== pull.head.sha) return false;
                      try { return JSON.parse(check.output?.text || 'null')?.pullNumber === number; }
                      catch { return false; }
                    });
                    const latest = checks.sort((a, b) => b.id - a.id)[0];
                    reviewSources.set(name, latest);
                    const assessment = assessments.filter(report => report.checkId === latest?.id).at(-1);
                    return latest?.status === 'completed' && latest.conclusion === 'success' &&
                      assessment && latest.external_id === `${assessment.id}:complete` &&
                      ['clear', 'findings'].includes(assessment.outcome);
                  });
                  // GitHub selects the test merge's checks once it has any status.
                  // Keep the head checks authoritative, and attest their verified results
                  // on that same test merge instead of leaving required names Expected.
                  const names = ['Project checks', 'Agent reviews completed', ...required];
                  const sources = names.map(name => reviewSources.has(name) ? reviewSources.get(name) : reviewerChecks.filter(check =>
                    check.name === name && check.app?.slug === 'github-actions' &&
                    check.head_sha === pull.head.sha).sort((a, b) => b.id - a.id)[0]);
                  const sourceChecksPassed = sources.every(check =>
                    check?.status === 'completed' && check.conclusion === 'success');
                  // Never hold the shared queue waiting for a reviewer behind us.
                  // Reviewer completion will request a fresh comparison job.
                  if (!complete || !sourceChecksPassed) break;
                  if (complete && sourceChecksPassed) {
                    // Recheck after reading reports/checks; never certify a moving comparison.
                    const { data: current } = await github.rest.pulls.get({ ...repo, pull_number: number });
                    if (current.state === 'open' && current.merge_commit_sha === pull.merge_commit_sha &&
                        JSON.stringify([current.head.sha, current.base.sha, current.base.ref]) === comparison) {
                      for (const source of sources) {
                        await github.rest.checks.create({ ...repo, name: source.name,
                          head_sha: checkMerge, status: 'completed', conclusion: 'success',
                          external_id: `comparison:${number}:${source.id}:${checkMerge}`,
                          details_url: source.html_url,
                          output: {
                            title: 'Verified result for this test merge',
                            summary: `The real ${source.name} check passed on ${pull.head.sha}. ` +
                              `Both finalized reviews cover target ${pull.base.sha} (${pull.base.ref}). ` +
                              'This attestation does not execute tests or waive findings.',
                            text: JSON.stringify({ version: 1, pullNumber: number,
                              sourceCheckId: source.id, head: pull.head.sha,
                              base: pull.base.sha, baseRef: pull.base.ref, testMerge: checkMerge }),
                          },
                        });
                      }
                      // Publication can take time. Do not certify a comparison that moved.
                      const { data: published } = await github.rest.pulls.get({ ...repo, pull_number: number });
                      if (published.state !== 'open' || published.merge_commit_sha !== checkMerge ||
                          JSON.stringify([published.head.sha, published.base.sha, published.base.ref]) !== comparison) {
                        await github.rest.checks.update({ ...repo, check_run_id: checkId,
                          status: 'completed', conclusion: 'failure', output: {
                            title: 'PR changed during publication', summary: 'Fresh verification is required.',
                          } });
                        return;
                      }
                      await github.rest.checks.update({ ...repo, check_run_id: checkId, status: 'completed', conclusion: 'success',
                        output: { title: 'Both reviews match this comparison', summary: 'Both reviews are complete with no unresolved findings, including recorded human dismissals.' } });
                      return;
                    }
                  }
                }
              }
              if (attempt < 4) await new Promise(resolve => setTimeout(resolve, 1500));
            }
            if (checkId) await github.rest.checks.update({ ...repo, check_run_id: checkId,
              status: 'completed', conclusion: 'failure', output: {
                title: 'Current comparison still needs review',
                summary: 'A required head check or current review is missing, failed, incomplete, or has unresolved findings. Reviewer completion refreshes verification; manual dispatch can retry without a model call.',
              } });
            core.setFailed('Both reviewers have not passed for the current PR comparison.');
